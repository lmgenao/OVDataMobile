name: Compilar APK de OVChat

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar los archivos de tu repositorio actual
    - name: Descargar Repositorio Usuario
      uses: actions/checkout@v4

    # 2. Configurar Node.js (v22 para compatibilidad con Capacitor)
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # 3. Configurar Java JDK (Actualizado a v21 para solucionar el error de source release)
    - name: Configurar Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    # 4. Instalar las herramientas de control de Android
    - name: Instalar Dependencias de Capacitor
      run: |
        npm install
        npm install @capacitor/cli @capacitor/core @capacitor/android

    # 5. Crear la vista de entrada móvil fija apuntando a tu chat en la nube
    - name: Vincular URL de la Aplicación
      run: |
        mkdir -p www
        echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>OVChat</title><script>window.location.href = "https://github.io";</script></head><body style="background:#000;color:#00f0ff;display:flex;justify-content:center;align-items:center;height:100vh;"><h2>Conectando al Servidor de OVChat...</h2></body></html>' > www/index.html

    # 6. Generar la estructura limpia de Android Studio en el servidor
    - name: Inicializar Entorno Android
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android

    # 7. Compilar el archivo APK binario real
    - name: Construir Paquete APK (Debug)
      run: |
        cd android
        ./gradlew assembleDebug

    # 8. Subir el APK terminado a la pestaña de Actions para tu descarga
    - name: Subir Archivo APK Terminado
      uses: actions/upload-artifact@v4
      with:
        name: Aplicacion-OVChat-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
