name: Compilar IPA de OV Data

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4

    - name: Clonar Estructura WebView Limpia
      run: |
        git clone "https://github.com" ios_wrapper
        cd ios_wrapper
        sed -i '' 's|https://vercel.app|https://github.com|g' "PWA to iOS wrapper/ViewController.swift"

    - name: Compilar Contenedor con Xcode Native
      run: |
        cd ios_wrapper
        xcodebuild -project "PWA to iOS wrapper.xcodeproj" -scheme "PWA to iOS wrapper" -configuration Debug -sdk iphoneos ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build

    - name: Empaquetar Estructura en archivo .IPA
      run: |
        mkdir -p build/Payload
        APP_PATH=$(find ios_wrapper/build -name "*.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "ERROR: No se encontró el binario .app compilado."
          exit 1
        fi
        cp -r "$APP_PATH" build/Payload/
        cd build
        zip -r OVData.ipa Payload/

    - name: Subir Archivo Final Terminado
      uses: actions/upload-artifact@v4
      with:
        name: Aplicacion-OVData-IPA
        path: build/OVData.ipa
