name: Compilar IPA de OV Data

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Instalar Dependencias del Núcleo
      run: |
        npm install
        npm install @capacitor/cli @capacitor/core @capacitor/ios

    - name: Crear Estructura de Entrada Nativa
      run: |
        mkdir -p www
        echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>OV Data</title><script>window.location.href = "http://192.168.1.15:8501";</script></head><body><h2>Conectando...</h2></body></html>' > www/index.html

    - name: Regenerar Entorno Nativo iOS
      run: |
        rm -rf ios
        npx cap add ios
        npx cap sync ios

    - name: Compilar Binario con Xcode
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos OBJROOT=$PWD/build SYMROOT=$PWD/build ONLY_ACTIVE_ARCH=NO
        
    - name: Empaquetar Estructura en archivo .IPA
      run: |
        mkdir -p build/Payload
        cp -r ios/App/build/build/Debug-iphoneos/App.app build/Payload/
        cd build
        zip -r OVData.ipa Payload/

    - name: Subir Archivo Final Terminado
      uses: actions/upload-artifact@v4
      with:
        name: Aplicacion-OVData-IPA
        path: build/OVData.ipa
