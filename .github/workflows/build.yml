yaml
name: Compilar IPA de OV Data

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Instalar Dependencias
      run: |
        npm install
        npm install @capacitor/ios

    - name: Sincronizar Proyecto
      run: npx cap sync ios

    - name: Compilar Binario con Xcode
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos OBJROOT=$PWD/build SYMROOT=$PWD/build ONLY_ACTIVE_ARCH=NO
        
    - name: Empaquetar Estructura en archivo .IPA
      run: |
        mkdir -p build/Payload
        cp -r ios/App/build/build/Debug-iphoneos/App.app build/Payload/
        cd build
        zip -r OVData.ipa Payload/

    - name: Subir Archivo Final Terminado
      uses: actions/upload-artifact@v4
      with:
        name: Aplicacion-OVData-IPA
        path: build/OVData.ipa
