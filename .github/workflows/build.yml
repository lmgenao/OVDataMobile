name: Compilar IPA de OV Data

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Instalar Dependencias del Núcleo
      run: |
        npm install
        npm install @capacitor/cli @capacitor/core @capacitor/ios

    - name: Crear Estructura de Entrada Nativa
      run: |
        mkdir -p www
        echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>OV Data</title><script>window.location.href = "https://github.com";</script></head><body><h2>Conectando...</h2></body></html>' > www/index.html

    - name: Construir y Forzar Proyecto iOS
      run: |
        rm -rf ios
        npx cap add ios
        npx cap copy ios
        npx cap update ios

    - name: Compilar Binario con Xcode
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO

    - name: Empaquetar Estructura en archivo .IPA
      run: |
        mkdir -p build/Payload
        APP_PATH=$(find ios/App -name "App.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "ERROR: No se encontró el binario App.app"
          exit 1
        fi
        cp -r "$APP_PATH" build/Payload/
        cd build
        zip -r OVData.ipa Payload/

    - name: Subir Archivo Final Terminado
      uses: actions/upload-artifact@v4
      with:
        name: Aplicacion-OVData-IPA
        path: build/OVData.ipa
