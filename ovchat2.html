<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>OVChat</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="OVChat"><script src="https://cloudflare.com"></script><script src="https://unpkg.com"></script><style>body{background:#000;color:#fff;font-family:-apple-system,sans-serif;padding:20px}*{box-sizing:border-box}input,textarea,select{width:100%;background:#1c1c1e;border:1px solid #2c2c2e;color:#fff;padding:12px;border-radius:10px;margin-bottom:10px;font-size:16px}.btn{background:#007aff;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:bold;width:100%;margin-bottom:8px;font-size:15px;display:block;text-align:center}.btn-sec{background:#2c2c2e}.btn-danger{background:#ff3b30}.btn-ok{background:#34c759}.flex{display:flex;gap:8px}.flex .btn{flex:1}#reader{width:100%;display:none;background:#000;margin-bottom:10px}#qr{background:#fff;padding:10px;width:fit-content;margin:10px auto;display:none}</style></head><body><h2>🔒 OVChat PRO</h2><input type="password" id="pin" placeholder="PIN Secreto"><div class="flex"><button class="btn btn-sec" onclick="scan('pin')">📷 QR PIN</button><button class="btn btn-sec" onclick="showQR('pin')">📱 Compartir PIN</button></div><div id="reader"></div><textarea id="txt" rows="5" placeholder="Mensaje plano o cifrado..."></textarea><div class="flex"><button class="btn btn-ok" onclick="enc()">🔒 Cifrar</button><button class="btn" onclick="dec()">🔓 Descifrar</button></div><div class="flex"><button class="btn btn-sec" onclick="scan('msg')">📷 QR Msg</button><button class="btn btn-sec" onclick="showQR('msg')">📱 QR Msg</button></div><button class="btn btn-danger" onclick="panic()">🚨 PÁNICO / PURGAR</button><div id="qr"></div><div id="hist" style="margin-top:10px;font-size:13px;color:#8e8e93;"></div><script>let s=null;async function getKey(p){const enc=new TextEncoder();const b=await crypto.subtle.importKey("raw",enc.encode(p),{name:"PBKDF2"},false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:enc.encode("OVSalt"),iterations:100000,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}async function enc(){const p=document.getElementById("pin").value,t=document.getElementById("txt").value;if(!p||!t)return alert("Faltan datos");try{const k=await getKey(p),enc=new TextEncoder(),iv=crypto.getRandomValues(new Uint8Array(12)),e=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},k,enc.encode(t));const c=new Uint8Array(iv.length+e.byteLength);c.set(iv,0);c.set(new Uint8Array(e),iv.length);document.getElementById("txt").value=btoa(String.fromCharCode(...c));addHist("🔒 Cifrado")}catch{alert("Error")}}async function dec(){const p=document.getElementById("pin").value,t=document.getElementById("txt").value.trim();if(!p||!t)return alert("Faltan datos");try{const k=await getKey(p),c=Uint8Array.from(atob(t),x=>x.charCodeAt(0)),iv=c.slice(0,12),d=c.slice(12),e=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},k,d);document.getElementById("txt").value=new TextDecoder().decode(e);addHist("🔓 Descifrado");setTimeout(()=>{document.getElementById("txt").value=""},30000)}catch{alert("Clave incorrecta o datos corruptos")}}function scan(mode){const r=document.getElementById("reader");r.style.display="block";s=new Html5Qrcode("reader");s.start({facingMode:"environment"},{fps:10,qrbox:250},t=>{if(mode==='pin')document.getElementById("pin").value=t;else document.getElementById("txt").value=t;s.stop().then(()=>{r.style.display="none"})},()=>{})}function showQR(mode){const v=mode==='pin'?document.getElementById("pin").value:document.getElementById("txt").value;if(!v)return alert("Campo vacío");const q=document.getElementById("qr");q.innerHTML="";q.style.display="block";new QRCode(q,{text:v,width:200,height:200})}function panic(){document.getElementById("pin").value="";document.getElementById("txt").value="";document.getElementById("qr").style.display="none";if(s){s.stop().then(()=>{document.getElementById("reader").style.display="none"})}alert("¡Purgado Completo!")}function addHist(a){const h=document.getElementById("hist"),d=document.createElement("div");d.innerHTML=`<b>${a}</b> - ${new Date().toLocaleTimeString()}`;h.insertBefore(d,h.firstChild)}</script></body></html>
